<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#08080a" />
    <title>Claude Usage</title>
    <script>
      /*
       * Resolve the theme before the first paint. The stylesheet has no
       * prefers-color-scheme rules — `data-theme` is always a concrete
       * `dark`/`light`, so without this a reload would flash the wrong
       * palette while React mounts. `App` keeps the attribute in sync after.
       */
      (function () {
        var saved = localStorage.getItem('cud.theme') || 'dark';
        var resolved =
          saved === 'system'
            ? window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
            : saved;
        document.documentElement.setAttribute('data-theme', resolved);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
